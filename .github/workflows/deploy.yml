name: deploy

on:
  workflow_call:
    inputs:
      GH-ENV:
        required: true
        type: string
  # Allows us to manually run the workflow
  workflow_dispatch:
    inputs:
      GH-ENV:
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: development

run-name: 'Deploying to ${{ inputs.GH-ENV }} by ${{ github.actor }}'

concurrency:
  group: ${{ inputs.GH-ENV }}-deploy
  cancel-in-progress: true

jobs:
  deploy:
    environment: ${{ inputs.GH-ENV }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: build
        run: npm run build

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          mask-aws-account-id: true
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: cdk deploy to ${{ inputs.GH-ENV }}
        run: npm run deploy:ci
        env:
          STAGE: ${{ vars.STAGE }}
          DOCKER_BUILDKIT: 1

  notify-slack-if-failure:
    needs: [deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_DEPLOY_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.DEVOPS_NOTIFICATIONS_SLACK_CHANNEL_ID }}
            text: ":exclamation: Workflow *${{ github.workflow }}* failed. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run>"
            blocks:
              - type: "section"
                text:
                  type: mrkdwn
                  text: ":exclamation: Workflow *${{ github.workflow }}* failed. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run>"
